# Single-machine development environment for the Mengpo memory service.
#
#   docker compose -f deploy/dev/docker-compose.yml up --build
#
# Services: pgvector PostgreSQL, NATS (wake-up notifications only), the Go API,
# the Go worker, and the React console served by nginx.
name: mengpo-dev

services:
  postgres:
    image: m.daocloud.io/docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mengpo
      POSTGRES_PASSWORD: mengpo
      POSTGRES_DB: mengpo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mengpo -d mengpo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mengpo-postgres:/var/lib/postgresql/data

  redis:
    image: m.daocloud.io/docker.io/redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: m.daocloud.io/docker.io/nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  memory-server:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: memory-server
    environment:
      MEMORY_DATABASE_URL: postgres://mengpo:mengpo@postgres:5432/mengpo?sslmode=disable
      MEMORY_NATS_URL: nats://nats:4222
      MEMORY_REDIS_URL: redis://redis:6379/0
      MEMORY_HTTP_ADDR: ":8080"
      MEMORY_EMBEDDING_ARTIFACT: /app/models/all-MiniLM-L6-v2-Q8_0.gguf
      MEMORY_QUEUE_ADAPTER: nats-core
      MEMORY_CONFIG_MASTER_KEY: ${MEMORY_CONFIG_MASTER_KEY:-mengpo-dev-master-key--32bytes--}
      MEMORY_ALLOW_EXTERNAL_LLM_ANALYSIS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  memory-worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: memory-worker
    environment:
      MEMORY_DATABASE_URL: postgres://mengpo:mengpo@postgres:5432/mengpo?sslmode=disable
      MEMORY_NATS_URL: nats://nats:4222
      MEMORY_REDIS_URL: redis://redis:6379/0
      MEMORY_EMBEDDING_ARTIFACT: /app/models/all-MiniLM-L6-v2-Q8_0.gguf
      MEMORY_QUEUE_ADAPTER: nats-core
      MEMORY_SCHEDULER_ADAPTER: internal
      MEMORY_SCHEDULE_DEFAULT_INTERVAL: 24h
      MEMORY_CONFIG_MASTER_KEY: ${MEMORY_CONFIG_MASTER_KEY:-mengpo-dev-master-key--32bytes--}
      MEMORY_ALLOW_EXTERNAL_LLM_ANALYSIS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.console
    ports:
      - "5173:80"
    depends_on:
      - memory-server

volumes:
  mengpo-postgres: