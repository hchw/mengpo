# Single-machine development environment for the Mengpo memory service.
#
#   docker compose -f deploy/dev/docker-compose.yml up --build
#
# Services: pgvector PostgreSQL, the Go API, the Go worker, and the React
# console served by nginx.
name: mengpo-dev

services:
  postgres:
    image: m.daocloud.io/docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mengpo
      POSTGRES_PASSWORD: mengpo
      POSTGRES_DB: mengpo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mengpo -d mengpo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mengpo-postgres:/var/lib/postgresql/data

  memory-server:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: runtime-llama
      args:
        SERVICE: memory-server
    environment:
      MEMORY_DATABASE_URL: postgres://mengpo:mengpo@postgres:5432/mengpo?sslmode=disable
      MEMORY_HTTP_ADDR: ":8080"
      MEMORY_EMBEDDING_ENABLED: "true"
      MEMORY_EMBEDDING_BINARY: llama-embedding
      MEMORY_EMBEDDING_ARTIFACT: /app/models/bge-small-zh-v1.5-Q8_0.gguf
      MEMORY_QUEUE_ADAPTER: none
      MEMORY_CONFIG_MASTER_KEY: ${MEMORY_CONFIG_MASTER_KEY:-mengpo-dev-master-key--32bytes--}
      MEMORY_ALLOW_EXTERNAL_LLM_ANALYSIS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  memory-worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: runtime-llama
      args:
        SERVICE: memory-worker
    environment:
      MEMORY_DATABASE_URL: postgres://mengpo:mengpo@postgres:5432/mengpo?sslmode=disable
      MEMORY_EMBEDDING_ENABLED: "true"
      MEMORY_EMBEDDING_BINARY: llama-embedding
      MEMORY_EMBEDDING_ARTIFACT: /app/models/bge-small-zh-v1.5-Q8_0.gguf
      MEMORY_QUEUE_ADAPTER: none
      MEMORY_SCHEDULER_ADAPTER: internal
      MEMORY_SCHEDULE_DEFAULT_INTERVAL: 24h
      MEMORY_SESSION_RETENTION: 168h
      MEMORY_CONFIG_MASTER_KEY: ${MEMORY_CONFIG_MASTER_KEY:-mengpo-dev-master-key--32bytes--}
      MEMORY_ALLOW_EXTERNAL_LLM_ANALYSIS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.console
    ports:
      - "5173:80"
    depends_on:
      - memory-server

volumes:
  mengpo-postgres: