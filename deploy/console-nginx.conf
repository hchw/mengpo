server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://memory-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /auth/ {
        proxy_pass http://memory-server:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}